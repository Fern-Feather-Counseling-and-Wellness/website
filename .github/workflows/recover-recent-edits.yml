name: Recover recent site edits
on:
  push:
    branches: [recover-site-edits]
    paths:
      - 'scripts/recover_recent_edits.py'
      - '.github/workflows/recover-recent-edits.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recover-site-edits
      - name: Recover recent intended edits
        run: python scripts/recover_recent_edits.py
      - name: Commit recovered pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed"
          else
            git commit -m "Restore recent clinician and navigation edits"
            git push origin HEAD:recover-site-edits
          fi
