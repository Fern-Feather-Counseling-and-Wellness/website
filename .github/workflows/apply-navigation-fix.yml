name: Apply permanent navigation fix
on:
  push:
    branches: [permanent-nav-fix]
    paths:
      - 'scripts/standardize_navigation.py'
      - '.github/workflows/apply-navigation-fix.yml'
permissions:
  contents: write
jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: permanent-nav-fix
      - name: Standardize navigation in every HTML page
        run: python scripts/standardize_navigation.py
      - name: Commit generated HTML changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed"
          else
            git commit -m "Standardize navigation across all HTML pages"
            git push origin HEAD:permanent-nav-fix
          fi
